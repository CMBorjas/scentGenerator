<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scent Generator API & Web</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0d1117;
            color: #00ffe1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: rgba(15, 23, 42, 0.8);
            border: 1px solid #00ffe1;
            box-shadow: 0 0 15px rgba(0, 255, 225, 0.3);
            padding: 2rem;
            border-radius: 8px;
            text-align: center;
            max-width: 600px;
        }
        h1 {
            margin-top: 0;
            color: #ff003c;
            text-shadow: 0 0 10px rgba(255, 0, 60, 0.5);
        }
        #scent-output {
            font-size: 1.5rem;
            margin: 2rem 0;
            min-height: 3rem;
            color: #fff;
        }
        button {
            background-color: transparent;
            color: #00ffe1;
            border: 2px solid #00ffe1;
            padding: 0.75rem 1.5rem;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            text-transform: uppercase;
        }
        button:hover {
            background-color: #00ffe1;
            color: #0d1117;
            box-shadow: 0 0 15px #00ffe1;
        }
        .instructions {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Scent Generator</h1>
        <p>A pleasant and putrid scent generator for the Memory Palace technique.</p>
        
        <div id="scent-output">Press generate...</div>
        
        <button id="generate-btn">Generate Combo</button>

        <div class="instructions">
            <p><strong>API Usage:</strong> Other projects can fetch the raw scent lists directly from:</p>
            <p><code>https://cmborjas.github.io/scentGenerator/pleasant.txt</code></p>
            <p><code>https://cmborjas.github.io/scentGenerator/pungent.txt</code></p>
        </div>
    </div>

    <script>
        // Use Fetch API to get the text files dynamically
        let pleasantScents = [];
        let pungentScents = [];

        async function loadScents() {
            try {
                const [pleasantRes, pungentRes] = await Promise.all([
                    fetch('pleasant.txt'),
                    fetch('pungent.txt')
                ]);
                
                const pleasantText = await pleasantRes.text();
                const pungentText = await pungentRes.text();

                pleasantScents = pleasantText.split('\n').map(s => s.trim()).filter(s => s.length > 0);
                pungentScents = pungentText.split('\n').map(s => s.trim()).filter(s => s.length > 0);
            } catch (error) {
                document.getElementById('scent-output').innerText = 'Error loading scent files. Must run on a web server.';
            }
        }

        document.getElementById('generate-btn').addEventListener('click', () => {
            if (pleasantScents.length === 0 || pungentScents.length === 0) {
                document.getElementById('scent-output').innerText = 'Still loading data...';
                return;
            }
            const p = pleasantScents[Math.floor(Math.random() * pleasantScents.length)];
            const pu = pungentScents[Math.floor(Math.random() * pungentScents.length)];
            document.getElementById('scent-output').innerHTML = `<span style="color: #ff99ff">${p}</span> and <span style="color: #ffff00">${pu}</span>`;
        });

        // Initialize
        loadScents();
    </script>
</body>
</html>
